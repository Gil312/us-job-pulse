name: Update US Labor Data (Automated BLS & FRED Sync)

on:
  schedule:
    # Runs at 14:00 UTC (9:00 AM EST) on Thursdays (Weekly Claims) & Fridays (Monthly Employment Situation)
    - cron: '0 14 * * 4,5'
  workflow_dispatch: # Allows manual trigger anytime from the GitHub Actions dashboard

permissions:
  contents: write

jobs:
  sync-labor-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run Labor Sync Script
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: npx tsx scripts/sync-bls.ts

      - name: Commit and Push Updated Snapshot
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [US Labor Sync]"
          git add public/data/latest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update official BLS/FRED labor snapshot [skip ci]" && git push)
